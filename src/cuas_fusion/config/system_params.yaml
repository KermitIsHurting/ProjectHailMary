radar_parser_node:
  ros__parameters:
    data_port: "/dev/radar_data"
    config_port: "/dev/radar_config"

# NOTE: section name must match the runtime node name ("classifier_node",
# set in the node constructor and every launch file) or ROS 2 silently
# ignores every parameter below and the node runs on hardcoded defaults.
classifier_node:
  ros__parameters:
    threatening_range_m: 4.0
    threatening_velocity_mps: 0.3
    zone_radius_m: 3.0
    escalation_dwell_s: 1.0
    track_timeout_s: 5.0

cuas_visualizer_node:
  ros__parameters:
    show_prediction_arc: true
    show_track_table: true
    show_velocity_vector: true
    show_ppi: true
    show_zone_timer: true
